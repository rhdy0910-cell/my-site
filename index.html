<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المكتبة</title>
<meta name="description" content="تعليم وثقافة ومقالات وذكاء اصطناعي بالعربية، ومنتدى ومساعد ذكي.">
<meta property="og:type" content="website"><meta property="og:locale" content="ar_AR"><meta property="og:title" content="المكتبة">
<meta name="theme-color" content="#1D4E89">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff;--soft:#F5F7FA;--ink:#1C2733;--mute:#5B6877;--line:#DDE3EA;--pri:#1D4E89;--on:#fff;--ps:#E6EEF8;--red:#B3261E;--fs:1.05rem;--r:8px;--font:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1720;--soft:#17222E;--ink:#E8EDF2;--mute:#9AA8B6;--line:#2B3947;--pri:#7FB1E8;--on:#0F1720;--ps:#1B2B3E;--red:#F2B8B5}}
:root[data-theme="dark"]{--bg:#0F1720;--soft:#17222E;--ink:#E8EDF2;--mute:#9AA8B6;--line:#2B3947;--pri:#7FB1E8;--on:#0F1720;--ps:#1B2B3E;--red:#F2B8B5}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.8 var(--font)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:78rem;margin:0 auto}
.topbg{background:var(--pri);color:var(--on)}
.top{display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem}
.av{width:2.6rem;height:2.6rem;border-radius:50%;object-fit:cover;background:var(--ps);color:var(--pri);display:grid;place-items:center;font-weight:700;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.brand b{font-size:1.2rem}.brand small{opacity:.85;font-size:.8rem}
.top input[type=search]{margin-inline-start:auto;width:15rem;max-width:40%;border:0;border-radius:var(--r);padding:.3rem .8rem;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink)}
.btn{background:var(--bg);color:var(--pri);border:1px solid var(--pri);border-radius:6px;padding:.25rem .9rem;font:inherit;font-size:.88rem;cursor:pointer}
.top .btn{border-color:var(--on);background:transparent;color:var(--on)}
.btn.p{background:var(--pri);color:var(--on)}
.titlebar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem 1rem;border-bottom:1px solid var(--line)}
.titlebar h1{font:700 1.5rem/1.4 var(--font);margin:0}
.crumbs{color:var(--mute);font-size:.85rem;width:100%}
#tools{margin-inline-start:auto;display:flex;gap:.5rem;flex-wrap:wrap}
#msg{background:var(--ps);padding:.5rem 1rem;font-size:.9rem}
.app{display:grid;grid-template-columns:14rem minmax(0,1fr) 300px;gap:1.5rem;padding:1.5rem 1rem;align-items:start}
aside{position:sticky;top:1rem}
.side h2,.adcol h2{font-size:.8rem;color:var(--mute);margin:0 0 .5rem;font-weight:600}
.row{display:flex;align-items:center}
.row a{flex:1;padding:.4rem .7rem;border-radius:6px}
.row a:hover{background:var(--soft)}
.row a[aria-current="page"]{background:var(--ps);color:var(--pri);font-weight:600}
main{min-width:0}
main h2{font:700 1.15rem/1.4 var(--font);margin:1.5rem 0 .8rem}
main h2:first-child{margin-top:0}
.hero{display:flex;gap:1rem;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem}
.hero .av{width:5rem;height:5rem;font-size:1.8rem}
.hero h2{margin:0;font-size:1.3rem}.hero p{margin:.2rem 0 0;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:1rem}
.card{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.card:hover{border-color:var(--pri)}
.card>a{flex:1;padding:.9rem 1rem}
small{color:var(--mute)}
.card small{display:block}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
ul.items li{display:flex;align-items:center;gap:.6rem;border:1px solid var(--line);border-radius:var(--r);padding:.6rem 1rem}
ul.items li:hover{border-color:var(--pri)}
ul.items a{flex:1;min-width:0}
ul.items img{width:3.2rem;height:3.2rem;object-fit:cover;border-radius:6px}
.x{background:none;border:0;color:var(--red);cursor:pointer;font:inherit;font-size:.82rem;padding:.2rem .4rem}
.x[data-a^="edit"],.x[data-a^="up"],.x[data-a^="down"],.x[data-a^="merge"],.x[data-a^="move"]{color:var(--pri)}
.ad{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--soft);aspect-ratio:6/5;display:grid;place-items:center;color:var(--mute);font-size:.85rem;text-align:center}
.ad iframe{width:100%;height:100%;border:0}
.adw{text-align:center;margin:1.5rem auto;max-width:728px}
.adw .ad{aspect-ratio:728/90}
.adw small,.adcol small{display:block;font-size:.72rem;margin-bottom:.2rem}
.mt{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.cover{width:100%;max-height:22rem;object-fit:cover;border-radius:var(--r);margin-bottom:1rem}
.body{font-size:var(--fs);line-height:2.1;max-width:46rem}
.chat{border:1px solid var(--line);border-radius:var(--r);margin-top:1.5rem;background:var(--soft);padding:1rem}
.chat h3{font:600 1rem var(--font);margin:0 0 .5rem;color:var(--pri)}
.log{max-height:22rem;overflow:auto}
.q,.a,.th{padding:.5rem .8rem;border-radius:var(--r);margin:.4rem 0;white-space:pre-wrap}
.q{background:var(--ps)}.a,.th{background:var(--bg);border:1px solid var(--line)}
.add{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
input,textarea,select{border:1px solid var(--line);border-radius:6px;padding:.35rem .7rem;font:inherit;font-size:.92rem;background:var(--bg);color:var(--ink);min-width:0}
.add input{flex:1}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);width:min(30rem,92vw);padding:1.2rem}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 .6rem}
dialog label{display:block;margin:.6rem 0 .2rem;font-size:.88rem;color:var(--mute)}
dialog input,dialog textarea,dialog select{width:100%}
.empty{color:var(--mute)}
footer{border-top:1px solid var(--line);padding:1rem;font-size:.85rem;color:var(--mute);display:flex;gap:1.2rem;flex-wrap:wrap}
@media(max-width:64rem){.app{grid-template-columns:14rem minmax(0,1fr)}.adcol{grid-column:1/-1;position:static;max-width:300px;justify-self:center;width:100%}}
@media(max-width:46rem){.app{grid-template-columns:1fr;gap:1rem}aside{position:static}.side h2{display:none}#nav{display:flex;gap:.3rem;overflow-x:auto;white-space:nowrap}.adw .ad{aspect-ratio:320/100}.top input[type=search]{max-width:100%;flex:1}.hero{flex-direction:column;text-align:center}}
#rp{position:fixed;top:0;inset-inline:0;height:3px;background:var(--pri);transform-origin:right;transform:scaleX(0);z-index:50}
.skip{position:absolute;inset-inline-start:-999px}.skip:focus{inset-inline-start:.5rem;top:.5rem;background:var(--bg);padding:.4rem .8rem;z-index:60;border-radius:6px}
html,body{max-width:100%;overflow-x:hidden}
.app>*{min-width:0}
.body,ul.items a,.card>a,.th,main h2{overflow-wrap:anywhere}
dialog{max-height:88vh;overflow:auto;margin:auto}
@media(max-width:46rem){
.app{grid-template-columns:minmax(0,1fr)}
#nav{max-width:100%;-webkit-overflow-scrolling:touch}
.top{flex-wrap:wrap;gap:.5rem}
.brand{flex:1;min-width:0}
.top input[type=search]{order:3;flex:1 1 100%;max-width:100%;width:100%;margin:0}
.top .btn{padding:.2rem .6rem;font-size:.82rem}
.titlebar h1{font-size:1.25rem}
.hero{padding:1rem}
}
</style>
</head>
<body>
<a class="skip" href="#ws">تخطَّ إلى المحتوى</a><div id="rp"></div>
<div class="topbg"><div class="wrap top">
  <span class="av" id="av"></span>
  <a data-l href="/" class="brand"><b id="sn">المكتبة</b><small id="tg"></small></a>
  <input id="q" type="search" placeholder="بحث" aria-label="بحث" autocomplete="off">
  <button class="btn" id="th" type="button" aria-label="تبديل الوضع الليلي">الوضع الليلي</button>

</div></div>

<div class="wrap" id="msg" hidden></div>
<div class="wrap app">
  <aside class="side"><h2>الأقسام</h2><div id="nav"></div></aside>

  <aside class="adcol"><small>إعلان</small><div id="ad1"></div></aside>
</div>
<footer class="wrap"><span id="ft"></span><a data-l href="/p/about">من نحن</a><a data-l href="/p/contact">تواصل معنا</a><a data-l href="/p/privacy">سياسة الخصوصية</a></footer>
<dialog id="dg"><form id="df"></form></dialog>
<script>
(function(){
var URL_='https://bzscqeatttfphmzxcfyo.supabase.co',KEY='sb_publishable_CLdRxUS4QKThTkBCY7XYgQ_HCtdk9kT';
var SB=supabase.createClient(URL_,KEY);
var S={sec:[],cat:[],itm:[],cfg:{name:'المكتبة',tagline:'',bio:'',avatar_url:null,ad_html:'',owner_id:null},user:null,owner:false,edit:false,hist:[],ctx:''};
var $=function(s){return document.querySelector(s)},ws=$('#ws'),fs=1.05;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function say(t){var m=$('#msg');m.textContent=t||'';m.hidden=!t;if(t)setTimeout(function(){m.hidden=true},7000)}
async function db(p){var r=await p;if(r.error){say('تعذر التنفيذ: '+r.error.message);throw r.error}return r.data}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:''}
function find(a,id){return a.filter(function(x){return x.id===id})[0]}
function fmt(d){return new Date(d).toLocaleDateString('ar',{year:'numeric',month:'long',day:'numeric'})}
function mins(t){return Math.max(1,Math.round((t||'').split(/\s+/).length/180))}
function saved(){try{return JSON.parse(localStorage.getItem('saved')||'[]')}catch(e){return[]}}
function doneList(){try{return JSON.parse(localStorage.getItem('done')||'[]')}catch(e){return[]}}
function isDone(id){return doneList().indexOf(id)>-1}
function prog(cid){var a=S.itm.filter(function(i){return i.category_id===cid}),d=a.filter(function(i){return isDone(i.id)}).length;return d?d+' من '+a.length+' مادة':a.length+' مادة'}
function isOn(){return S.edit&&S.owner}
async function load(){
var r=await Promise.all([SB.from('site_settings').select('*').eq('id',1).single(),SB.from('sections').select('*').order('position'),SB.from('categories').select('*').order('position'),SB.from('items').select('id,category_id,title,url,image_url,created_at').order('created_at',{ascending:false}).limit(2000)]);
if(r[0].data)S.cfg=r[0].data;S.sec=r[1].data||[];S.cat=r[2].data||[];S.itm=r[3].data||[];
if(r.some(function(x){return x.error}))say('تعذر تحميل البيانات، حدّث الصفحة.')}
async function who(){var s=(await SB.auth.getSession()).data.session;S.user=s?s.user:null;S.owner=false;if(S.user){var r=await SB.rpc('is_owner');S.owner=r.data===true}if(!S.owner)S.edit=false}
function chrome(){var c=S.cfg;$('#sn').textContent=c.name;$('#tg').textContent=c.tagline||'';$('#ft').textContent='© '+c.name;
$('#av').outerHTML=c.avatar_url?'<img class="av" id="av" alt="'+esc(c.name)+'" src="'+esc(c.avatar_url)+'">':'<span class="av" id="av">'+esc(c.name.charAt(0))+'</span>';
$('#lg').textContent=S.user?'خروج':'دخول';
var t='';
if(S.user&&!c.owner_id)t+='<button class="btn" data-a="claim">تفعيل ملكية الموقع</button>';
if(S.owner)t+='<button class="btn'+(S.edit?' p':'')+'" data-a="toggle">'+(S.edit?'إنهاء التعديل':'وضع التعديل')+'</button>';
if(isOn())t+='<button class="btn" data-a="cfg">إعدادات الموقع</button><button class="btn" data-a="addsec">قسم جديد</button>';
$('#tools').innerHTML=t;
var ad=(c.ad_html||'').split('<!--slot2-->');S.ad=[ad[0]||'',ad[1]||''];
$('#ad1').innerHTML=adbox(S.ad[0],'300 × 250');
var p=location.pathname,sec=p.indexOf('/s/')===0?find(S.sec,p.slice(3)):null;
var cat=p.indexOf('/c/')===0?find(S.cat,p.slice(3)):null;if(cat)sec=find(S.sec,cat.section_id);
var cp=(S.ctxSec&&p.indexOf('/i/')===0)?S.ctxSec:null;if(cp)sec=find(S.sec,cp);
var nv='<div class="row"><a data-l href="/"'+(p==='/'?' aria-current="page"':'')+'>الرئيسية</a></div>'+S.sec.map(function(s){return '<div class="row"><a data-l href="/s/'+s.id+'"'+(sec&&sec.id===s.id?' aria-current="page"':'')+'>'+esc(s.name)+'</a></div>'}).join('')+'<div class="row"><a data-l href="/forum"'+(p.indexOf('/forum')===0||p.indexOf('/t/')===0?' aria-current="page"':'')+'>المنتدى</a></div><div class="row"><a data-l href="/saved"'+(p==='/saved'?' aria-current="page"':'')+'>المحفوظات</a></div><div class="row"><a data-l href="/assistant"'+(p==='/assistant'?' aria-current="page"':'')+'>المساعد</a></div>';
$('#nav').innerHTML=nv}
function adbox(h,ph){return '<div class="ad">'+(h?'<iframe sandbox="allow-scripts allow-popups" srcdoc="'+esc(h)+'" title="إعلان" loading="lazy"></iframe>':'<span>مساحتك الإعلانية<br><small dir="ltr">'+ph+'</small></span>')+'</div>'}
function wide(){return '<div class="adw"><small>إعلان</small>'+adbox(S.ad[1],'728 × 90')+'</div>'}
function eb(l,a,id){return isOn()?'<button class="x" type="button" data-a="'+a+'" data-id="'+id+'">'+l+'</button>':''}
function ctl(k,id){return eb('تعديل','edit'+k,id)+eb('▲','up'+k,id)+eb('▼','down'+k,id)+eb('دمج','merge'+k,id)+(k==='cat'?eb('نقل','movecat',id):'')+eb('حذف','del'+k,id)}
function card(href,t,sub,ex){return '<div class="card"><a data-l href="'+href+'">'+esc(t)+(sub?'<small>'+esc(sub)+'</small>':'')+'</a>'+(ex||'')+'</div>'}
function nItems(f){return S.itm.filter(f).length}
function rows(a){return a.length?'<ul class="items">'+a.map(function(i){var c=find(S.cat,i.category_id),s=c&&find(S.sec,c.section_id);return '<li>'+(i.image_url?'<img alt="" loading="lazy" src="'+esc(i.image_url)+'">':'')+'<a data-l href="/i/'+i.id+'">'+(isDone(i.id)?'✓ ':'')+esc(i.title)+'<small style="display:block">'+(s?esc(s.name)+' / '+esc(c.name)+'، ':'')+fmt(i.created_at)+'</small></a>'+eb('تعديل','edititem',i.id)+eb('حذف','delitem',i.id)+'</li>'}).join('')+'</ul>':'<p class="empty">لا توجد مواد.</p>'}
function page(name,crumbs,desc){$('#ttl').textContent=name;$('#crumbs').innerHTML=crumbs||'';document.title=(name==='الرئيسية'?'':name+' | ')+S.cfg.name;var m=document.querySelector('meta[name=description]');m.content=(desc||S.cfg.tagline||S.cfg.bio||'').slice(0,160);var o=document.querySelector('meta[property="og:title"]');o.content=document.title;var cl=document.querySelector('link[rel=canonical]');if(!cl){cl=document.createElement('link');cl.rel='canonical';document.head.appendChild(cl)}cl.href=location.origin+location.pathname}
function chat(h){return '<div class="chat"><h3>'+h+'</h3><div class="mt"><select id="cm" aria-label="أسلوب المساعد"><option value="direct">أسلوب: إجابة مباشرة</option><option value="guide">أسلوب: علّمني خطوة بخطوة</option></select><button class="btn" data-a="quick" data-q="لخّص هذه المادة في نقاط قصيرة">لخّص</button><button class="btn" data-a="quick" data-q="اشرح هذه المادة ببساطة كأنني مبتدئ">بسّطها</button><button class="btn" data-a="quick" data-q="اختبرني في هذه المادة بسؤال واحد الآن">اختبرني</button></div><div class="log id="log" aria-live="polite"></div><div class="add"><input id="ci" placeholder="اكتب سؤالك" aria-label="سؤالك"><button class="btn p" type="button" data-a="ask">اسأل</button></div></div>'}
function drawLog(){var l=$('#log');if(l){l.innerHTML=S.hist.map(function(h){return '<div class="'+(h.role==='user'?'q':'a')+'">'+esc(h.text)+'</div>'}).join('');l.scrollTop=l.scrollHeight}}
async function askAI(){var i=$('#ci'),q=i&&i.value.trim();if(!q)return;i.value='';var prev=S.hist.slice(-6);S.hist.push({role:'user',text:q},{role:'assistant',text:'...'});drawLog();
var idx=S.sec.map(function(s){return s.name+': '+S.cat.filter(function(c){return c.section_id===s.id}).map(function(c){return c.name+' ['+S.itm.filter(function(x){return x.category_id===c.id}).slice(0,12).map(function(x){return x.title}).join('، ')+']'}).join('؛ ')}).join('\n');
var out;try{var r=await fetch(URL_+'/functions/v1/assistant',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({question:q,context:S.ctx,index:idx.slice(0,4000),site:S.cfg.name,mode:($('#cm')||{}).value||'direct',history:prev})});var j=await r.json();out=j.text||j.error||'لم يصل رد.'}catch(e){out='تعذر الاتصال بالمساعد الآن.'}
S.hist[S.hist.length-1]={role:'assistant',text:out};drawLog()}
async function vHome(){page('الرئيسية','');S.ctx='الصفحة: الرئيسية';var c=S.cfg;
return '<div class="hero">'+(c.avatar_url?'<img class="av" alt="" src="'+esc(c.avatar_url)+'">':'<span class="av">'+esc(c.name.charAt(0))+'</span>')+'<div><h2>'+esc(c.name)+'</h2>'+(c.tagline?'<p>'+esc(c.tagline)+'</p>':'')+(c.bio?'<p>'+esc(c.bio)+'</p>':'')+'</div></div><h2>الأقسام</h2><div class="grid">'+S.sec.map(function(s){return card('/s/'+s.id,s.name,nItems(function(i){var k=find(S.cat,i.category_id);return k&&k.section_id===s.id})+' مادة')}).join('')+'</div>'+wide()+'<h2>الأحدث</h2>'+rows(S.itm.slice(0,8))}
async function vSec(id){var s=find(S.sec,id);if(!s)return nf();page(s.name,'<a data-l href="/">الرئيسية</a>');S.ctx='الصفحة: قسم '+s.name;
return '<h2>التصنيفات</h2><div class="grid">'+S.cat.filter(function(c){return c.section_id===id}).map(function(c){return card('/c/'+c.id,c.name,prog(c.id),ctl('cat',c.id))}).join('')+'</div>'+(isOn()?'<div class="add"><button class="btn p" data-a="addcat" data-id="'+id+'">تصنيف جديد</button></div>':'')+wide()}
async function vCat(id){var c=find(S.cat,id);if(!c)return nf();var s=find(S.sec,c.section_id);page(c.name,'<a data-l href="/">الرئيسية</a> › <a data-l href="/s/'+s.id+'">'+esc(s.name)+'</a>');S.ctx='الصفحة: تصنيف '+c.name+' في '+s.name;S.ctxSec=s.id;
return rows(S.itm.filter(function(i){return i.category_id===id}))+(isOn()?'<div class="add"><button class="btn p" data-a="additem" data-id="'+id+'">مادة جديدة</button></div>':'')}
async function vItem(id){var it=await db(SB.from('items').select('*').eq('id',id).maybeSingle());if(!it)return nf();var c=find(S.cat,it.category_id),s=c&&find(S.sec,c.section_id);
S.ctxSec=s&&s.id;page(it.title,'<a data-l href="/">الرئيسية</a>'+(s?' › <a data-l href="/s/'+s.id+'">'+esc(s.name)+'</a> › <a data-l href="/c/'+c.id+'">'+esc(c.name)+'</a>':''),it.body);
S.ctx='المادة المعروضة ('+it.title+'):\n'+it.body.slice(0,6000);S.cur=it.title+'. '+it.body;S.url=safeUrl(it.url);
var rel=S.itm.filter(function(x){return x.category_id===it.category_id&&x.id!==id}).slice(0,4),on=saved().indexOf(id)>-1;

async function route(){var p=location.pathname,q=new URLSearchParams(location.search).get('q'),m=p.match(/^\/(s|c|i|t)\/([\w-]+)/),h;

ws.innerHTML=h;chrome();drawLog()}

function ask(title,fields,btns,ok){var dg=$('#dg'),df=$('#df');
df.innerHTML='<h3>'+esc(title)+'</h3>'+fields.map(function(f,i){var id='f'+i,v=f.v==null?'':f.v;if(f.t==='note')return '<p>'+esc(f.l)+'</p>';var lb='<label for="'+id+'">'+esc(f.l)+'</label>';
if(f.t==='area')return lb+'<textarea id="'+id+'" rows="8">'+esc(v)+'</textarea>';
if(f.t==='select')return lb+'<select id="'+id+'">'+f.o.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
if(f.t==='file')return lb+'<input id="'+id+'" type="file" accept="image/*">';
return lb+'<input id="'+id+'" type="'+(f.t||'text')+'" value="'+esc(v)+'"'+(f.d?' dir="ltr"':'')+'>'}).join('')+'<div class="add">'+btns.map(function(b,i){return '<button class="btn'+(i?'':' p')+'" value="'+b[0]+'">'+b[1]+'</button>'}).join('')+'<button class="btn" value="x" formnovalidate>إلغاء</button></div>';
df.onsubmit=async function(e){e.preventDefault();var w=e.submitter&&e.submitter.value;if(w==='x'){dg.close();return}
var vals=fields.map(function(f,i){if(f.t==='note')return null;var el=$('#f'+i);return f.t==='file'?(el.files[0]||null):el.value.trim()});
try{await ok(vals,w);dg.close()}catch(er){}};dg.showModal()}
async function up(file){if(!file)return null;if(!/^image\//.test(file.type)||file.size>3e6){say('الصورة يجب أن تكون ملف صورة لا يتجاوز 3 ميجابايت.');throw 0}
var p=Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.'+((file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''));
var r=await SB.storage.from('media').upload(p,file,{contentType:file.type});if(r.error){say('تعذر رفع الصورة: '+r.error.message);throw r.error}return SB.storage.from('media').getPublicUrl(p).data.publicUrl}
function confirmDel(msg,fn){ask('تأكيد الحذف',[{t:'note',l:msg}],[['ok','حذف نهائي']],async function(){await fn();await reload()})}
function secOpts(ex){return S.sec.filter(function(s){return s.id!==ex}).map(function(s){return[s.id,s.name]})}
function catOpts(ex){return S.cat.filter(function(c){return c.id!==ex}).map(function(c){var s=find(S.sec,c.section_id);return[c.id,(s?s.name+' / ':'')+c.name]})}
async function swap(list,tbl,id,d){var l=list.filter(function(x){return tbl==='sections'||x.section_id===find(list,id).section_id});var i=l.findIndex(function(x){return x.id===id}),j=i+d;if(j<0||j>=l.length)return;var a=l[i],b=l[j],pa=a.position,pb=b.position;if(pa===pb){pa=i;pb=j}
await db(SB.from(tbl).update({position:pb}).eq('id',a.id));await db(SB.from(tbl).update({position:pa}).eq('id',b.id));await reload()}
